[package]
name = "solx-firefox-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "solx-firefox"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
solx-package-log = { package = "solx-package-lib", path = "../solx-package-lib" }

[workspace]
