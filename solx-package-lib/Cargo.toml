[package]
name = "solx-package-lib"
version = "0.1.0"
edition = "2021"
description = "Shared runtime for solx-core Command-action packages: logging (stderr, a SOL_LOG_DIR file, and the console loopback), cooperative cancellation, solx-server connection config, document persistence, and the background-command protocol."

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["rt", "time", "net", "io-util", "io-std", "sync", "macros"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "net", "io-util"] }
tempfile = "3"
serial_test = "3"

[workspace]
