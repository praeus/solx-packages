[package]
name = "solx-omniparse-process-file"
version = "0.1.0"
edition = "2021"

[dependencies]
base64 = "0.22"
omniparse = { version = "0.4", features = ["ocr-ml", "pdf-extract"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
solx-package-log = { package = "solx-package-lib", path = "../solx-package-lib" }
tokio = { version = "1", default-features = false, features = ["rt", "macros"] }

[workspace]
