[package]
name = "solx-package-log"
version = "0.1.0"
edition = "2021"
description = "Shared logging for solx-core Command-action packages: stderr, a SOL_LOG_DIR file, and the solx-core console loopback, from one call."

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["rt", "time", "net"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "net", "io-util"] }
tempfile = "3"
serial_test = "3"

[workspace]
