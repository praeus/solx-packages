[package]
name = "solx-prompt"
version = "0.1.0"
edition = "2021"
publish = false
description = "Turn a prompt into a message plus catalogue-validated action steps: intent, search, steps - a wasm action for solx-core"

# Its own workspace: this is a wasm32-wasip2 artifact built by ../build.ps1 /
# ../build.sh, not a member of any surrounding workspace. The TypeScript half of
# this package lives in ../widget and shares nothing with it but the install
# script.
[workspace]

[lib]
# `cdylib` produces the component; `rlib` lets `tests/` link the crate so the
# pure pipeline logic can be exercised on the host target.
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json = { version = "1", default-features = false, features = ["alloc"] }

# wit-bindgen only exists for the guest. Keeping it off the host target is what
# lets `cargo test` link: `generate!` emits `#[link(wasm_import_module = ...)]`
# externs and `export!` emits `#[export_name]` shims referencing them, neither
# of which resolve in a host test binary.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen = "0.36"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
# Safe: a guest panic traps and the host reports it as success:false. Note this
# makes `cargo test --release` unusable - test in the dev profile.
panic = "abort"
