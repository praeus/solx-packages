[package]
name = "solx-mcp-actions-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "solx-mcp-actions"
path = "src/main.rs"

[dependencies]
rmcp = { version = "2.2", features = ["client", "transport-child-process"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "time"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
solx-package-log = { package = "solx-package-lib", path = "../solx-package-lib" }

[workspace]
