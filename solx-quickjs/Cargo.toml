[package]
name = "solx-quickjs"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
componentize-qjs = "0.4.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[build-dependencies]
# solx-custom-actions-lib is a no-op build dependency used solely to locate
# the canonical `custom-action.wit` file via the `DEP_SOL_CUSTOM_WIT_CUSTOM_WIT`
# env var emitted by its build script (the crate kept `links = "sol_custom_wit"`
# so this env var name is unchanged from the old sol-actions-lib). The crate
# is built from the sibling `solx-core/` workspace (../../solx-core/solx-wasm).
solx-custom-actions-lib = { path = "../../solx-core/solx-wasm", default-features = false }

[dev-dependencies]
assert_fs = "1"
